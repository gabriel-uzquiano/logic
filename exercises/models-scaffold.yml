# --- Chapter 9 body examples: countermodels for Examples 9.1 and 9.2 ---------
# Both arguments are quantificationally INVALID, so each entry is a
# countermodel: every premise true, conclusion false.  Formulas are listed
# premises-first, conclusion last.  Domain elements 1, 2, 3 correspond to the
# nodes p1, p2, p3 of the diagrams already printed in the chapter.

# Example 9.1 -- All physicists admire Newton; Newton admires some
# mathematicians; so some physicists admire some mathematicians.
#   P = _ is a physicist, Q = _ is a mathematician, R = _ admires _, a = Newton
# Matches figure images/7.13.png: P = {p1}, Q = {p3}, R = {(p1,p2), (p2,p3)}.
# NOTE: the interpretation below sets a = p2, NOT the a = p1 printed in the
# chapter's margin key.  With a = p1 both premises come out FALSE, since the
# only physicist p1 would have to admire itself.  The margin key needs fixing.
# (Exercise entry inv-5 is the same argument, but its worked countermodel is
#  vacuous -- P is empty -- so it is less useful in the body of the text.)
