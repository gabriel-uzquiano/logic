# models-scaffold.yml
# Catalog of model-checker configurations for the Semantics / Models chapter.
# Each entry stores the model-checker "Copy link" hash:
#   worked_hash    -> formulas + a worked interpretation (students see a model)
#   practice_hash  -> formulas only, model BLANK (students construct the model)
#
# Load with:  models <- mc_load("exercises/models-scaffold.yml")
# Then in a chapter:
#   `r mc_embed(models[["atomic"]], solution = TRUE)`  # interactive worked model
#   `r mc_link(models[["logtruth-counter"]], solution = TRUE, label = "configuration")`
#
# IMPORTANT: quote every hash. A leading # starts a YAML comment, so an
# unquoted #v2:... would be silently dropped.
#
# How to capture a hash:
#   1. Open https://gabriel-uzquiano.github.io/model-checker/
#   2. Type the formulas and (for worked_hash) build the interpretation
#   3. Press "Copy link"
#   4. Paste the #v2:... portion into worked_hash / practice_hash below

# --- Countermodel (invalidity) --- WORKING DEMO ----------------------------
# Argument: Pa, Pa -> Qb, therefore Qa.  INVALID.
# Worked countermodel: domain {a,b}, P = {a}, Q = {b}.
#   Pa = T (a in P),  Pa->Qb = T (Qb = T),  Qa = F (a not in Q)  => invalid.
# (A ✓ next to a formula means it PARSED ok, not that it is true; truth values
# come from the Evaluate step.)
- id: "countermodel"
  label: "Countermodel: Pa, Pa→Qb ⊢ Qa"
  formulas:
    - "Pa"
    - "Pa -> Qb"
    - "Qa"
  worked_hash: "#v2:eyJmIjpbIlBhIiwiUGEgLT4gUWIiLCJRYSJdLCJkIjpbImEiLCJiIl0sImkiOnsiUCI6WyJhIl0sIlEiOlsiYiJdfX0="
  practice_hash: "#v2:eyJmIjpbIlBhIiwiUGEgLT4gUWIiLCJRYSJdfQ=="

